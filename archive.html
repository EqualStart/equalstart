<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архив подарков — Равный старт</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #222;
            background: #f7f7f5;
            line-height: 1.6;
        }

        header {
            background: white;
            border-bottom: 1px solid #e5e5e5;
            padding: 24px 20px;
        }

        .header-inner {
            max-width: 1000px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;
            color: #222;
        }

        .back {
            color: #555;
            text-decoration: none;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 70px 20px 100px;
        }

        h1 {
            font-size: 44px;
            margin: 0 0 12px;
        }

        .intro {
            color: #666;
            font-size: 18px;
            margin-bottom: 50px;
        }

        .gift {
            background: white;
            border: 1px solid #e2e2e2;
            border-radius: 10px;
            padding: 32px;
            max-width: 720px;
        }

        .gift-number {
            font-size: 14px;
            color: #777;
            margin-bottom: 8px;
        }

        .gift h2 {
            font-size: 28px;
            margin: 0 0 5px;
        }

        .institution {
            color: #666;
            margin-bottom: 30px;
        }

        .row {
            display: grid;
            grid-template-columns: 180px 1fr;
            padding: 11px 0;
            border-bottom: 1px solid #eee;
        }

        .row:last-of-type {
            border-bottom: none;
        }

        .label {
            color: #777;
        }

        .status {
            display: inline-block;
            margin-top: 25px;
            padding: 8px 13px;
            background: #f0f0ed;
            border-radius: 6px;
            font-weight: bold;
        }

        footer {
            max-width: 1000px;
            margin: auto;
            padding: 35px 20px;
            color: #777;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            h1 { font-size: 36px; }

            .row {
                grid-template-columns: 1fr;
                gap: 3px;
            }

            .gift {
                padding: 24px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">
        <a class="logo" href="index.html">Равный старт</a>
        <a class="back" href="index.html">← На главную</a>
    </div>
</header>

<main>

    <h1>Архив подарков</h1>

    <p class="intro">
        История подарков проекта «Равный старт».
    </p>

    <article class="gift">

        <div class="gift-number">ПОДАРОК №0001</div>

        <h2>Игровая консоль</h2>

        <div class="institution">
            Омск · Дом детства им. Кравцова
        </div>

        <div class="row">
            <div class="label">Возраст</div>
            <div>14 лет</div>
        </div>

        <div class="row">
            <div class="label">День рождения</div>
            <div>3 ноября</div>
        </div>

        <div class="row">
            <div class="label">Стоимость</div>
            <div>1 868 ₽</div>
        </div>

        <div class="row">
            <div class="label">Получен</div>
            <div>14 ноября</div>
        </div>

        <div class="row">
            <div class="label">Место получения</div>
            <div>ПВЗ Wildberries</div>
        </div>

        <div class="status">
            Получен учреждением
        </div>

    </article>

</main>

<footer>
    © Равный старт
</footer>

</body>
</html>
