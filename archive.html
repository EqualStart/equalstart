<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архив подарков — Равный старт</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #222;
            background: #f7f7f5;
            line-height: 1.6;
        }

        header {
            background: white;
            border-bottom: 1px solid #e5e5e5;
            padding: 24px 20px;
        }

        .header-inner {
            max-width: 1000px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #222;
            text-decoration: none;
        }

        .back {
            color: #555;
            text-decoration: none;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 70px 20px 100px;
        }

        h1 {
            font-size: 44px;
            margin: 0 0 12px;
        }

        .intro {
            color: #666;
            font-size: 18px;
            margin-bottom: 50px;
        }

        .gift {
            display: block;
            max-width: 720px;
            padding: 28px 30px;
            background: white;
            border: 1px solid #e2e2e2;
            border-radius: 10px;
            color: #222;
            text-decoration: none;
        }

        .gift:hover {
            border-color: #aaa;
        }

        .number {
            color: #777;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .gift h2 {
            font-size: 26px;
            margin: 0 0 5px;
        }

        .institution {
            color: #666;
            margin-bottom: 20px;
        }

        .details {
            color: #555;
        }

        .more {
            margin-top: 20px;
            font-weight: bold;
        }

        footer {
            max-width: 1000px;
            margin: auto;
            padding: 35px 20px;
            color: #777;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            h1 { font-size: 36px; }

            .gift {
                padding: 24px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">
        <a class="logo" href="index.html">Равный старт</a>
        <a class="back" href="index.html">← На главную</a>
    </div>
</header>

<main>

    <h1>Архив подарков</h1>

    <p class="intro">
        История подарков проекта «Равный старт».
    </p>

    <a class="gift" href="gifts/0001.html">

        <div class="number">ПОДАРОК №0001</div>

        <h2>Игровая консоль</h2>

        <div class="institution">
            Омск · Дом детства им. Кравцова
        </div>

        <div class="details">
            14 ноября 2025 · 1 868 ₽
        </div>

        <div class="more">
            Подробнее →
        </div>

    </a>

</main>

<footer>
    © Равный старт
</footer>

</body>
</html>
