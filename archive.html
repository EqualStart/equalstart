<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Архив подарков — Равный старт</title>
  <link rel="stylesheet" href="archive.css?v=wide-intro">
  <script type="module" src="archive.js?v=aligned-cards"></script>
</head>
<body data-page="archive">
<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">✳</span> Равный старт</a>
    <a class="nav-link" href="index.html">На главную</a>
  </div>
</header>
<main class="shell">
  <section class="archive-intro">
    <h1>Архив подарков</h1>
    <p>Мы сохраняем историю подарков, которые дети выбирают сами. Каждая запись — маленькая часть большого дела.</p>
    <dl class="stats">
      <div><dt>Подарков</dt><dd id="gift-count">—</dd></div>
      <div><dt>Учреждений</dt><dd id="institution-count">—</dd></div>
      <div><dt>Год начала проекта</dt><dd>2025</dd></div>
    </dl>
  </section>
  <section class="catalog" aria-label="Каталог подарков">
    <form id="filters" class="filters" role="search" hidden>
      <label>Поиск<input id="search" type="search" placeholder="Номер или название"></label>
      <label>Год получения<select id="year"><option value="">Все годы</option></select></label>
      <label>Детский дом<select id="institution"><option value="">Все учреждения</option></select></label>
      <label>Дата получения<select id="sort"><option value="recent">Сначала новые</option><option value="oldest">Сначала ранние</option></select></label>
    </form>
    <p class="results" id="results" role="status">Загрузка архива…</p>
    <noscript>Для просмотра архива включите JavaScript.</noscript>
    <ul id="gift-list" class="gift-grid"></ul>
  </section>
</main>
<footer class="shell site-footer">© Равный старт</footer>
</body>
</html>
